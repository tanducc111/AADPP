<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AADPP OCR Region</title>
    <style>
      :root {
        color-scheme: light;
        --accent: #0052ff;
        --accent-secondary: #4d7cff;
        --border: #e2e8f0;
        --foreground: #0f172a;
        --muted: #64748b;
        --surface: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        width: 320px;
        margin: 0;
        background: #f8fafc;
        color: var(--foreground);
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      .popup-shell {
        padding: 18px;
      }

      .card {
        overflow: hidden;
        border: 1px solid rgba(148, 163, 184, 0.35);
        border-radius: 18px;
        background:
          radial-gradient(circle at top right, rgba(77, 124, 255, 0.18), transparent 32%),
          var(--surface);
        box-shadow: 0 18px 45px rgba(15, 23, 42, 0.12);
      }

      .header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 18px 18px 14px;
      }

      .logo {
        display: grid;
        width: 42px;
        height: 42px;
        place-items: center;
        border-radius: 14px;
        background: linear-gradient(135deg, var(--accent), var(--accent-secondary));
        color: white;
        font-size: 18px;
        font-weight: 800;
        box-shadow: 0 12px 30px rgba(0, 82, 255, 0.35);
      }

      h1 {
        margin: 0;
        font-size: 16px;
        line-height: 1.2;
      }

      p {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.5;
      }

      .status-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-top: 1px solid var(--border);
        padding: 14px 18px;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 650;
      }

      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: #f59e0b;
        box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.12);
      }

      .status.connected .status-dot {
        background: #10b981;
        box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.12);
      }

      .body {
        padding: 0 18px 18px;
      }

      button {
        width: 100%;
        min-height: 44px;
        border: 0;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--accent), var(--accent-secondary));
        color: white;
        cursor: pointer;
        font: inherit;
        font-size: 13px;
        font-weight: 800;
        box-shadow: 0 14px 30px rgba(0, 82, 255, 0.28);
        transition:
          transform 160ms ease,
          filter 160ms ease,
          opacity 160ms ease;
      }

      button:hover {
        filter: brightness(1.04);
        transform: translateY(-1px);
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
        transform: none;
      }

      .hint {
        margin-top: 12px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main class="popup-shell">
      <section class="card" aria-label="AADPP OCR region selector">
        <div class="header">
          <div class="logo" aria-hidden="true">A</div>
          <div>
            <h1>AADPP OCR Region</h1>
            <p>Select a document area and send it to Gemini OCR.</p>
          </div>
        </div>
        <div class="status-row">
          <span id="connectionStatus" class="status">
            <span class="status-dot" aria-hidden="true"></span>
            Checking tab
          </span>
        </div>
        <div class="body">
          <button id="selectRegionButton" type="button">Select OCR Region</button>
          <div id="popupHint" class="hint">Open an AADPP document page, then click this button.</div>
        </div>
      </section>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
